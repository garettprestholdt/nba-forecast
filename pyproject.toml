[project]
name = "nbaforecast"
version = "0.1.0"
description = "Daily NBA win-probability forecasts, publicly scored against the betting market."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nbaf = "nbaforecast.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
