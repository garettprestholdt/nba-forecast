[project]
name = "nbaforecast"
version = "0.1.0"
description = "Daily NBA win-probability forecasts, publicly scored against the betting market."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=2.0.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[project.scripts]
nbaf = "nbaforecast.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
