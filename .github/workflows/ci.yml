name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: dbt build (fixture data)
        # Real data lives only on the maintainer's machine, so CI builds every model and runs
        # every data test on a small slice of real games. Full-season count checks are off.
        run: |
          cp -R tests/fixtures/nbaf_data "$RUNNER_TEMP/nbaf_data"
          NBAF_DATA_DIR="$RUNNER_TEMP/nbaf_data" uv run nbaf dbt build --vars '{check_season_counts: false}'
