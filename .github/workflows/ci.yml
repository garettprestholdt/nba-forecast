name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the attribution check
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Attribution check (no Claude/Anthropic co-authors or bot authors)
        # On a PR, check the commits it adds; on main, check all of history.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run python -m nbaforecast.attribution "origin/${{ github.base_ref }}..HEAD"
          else
            uv run python -m nbaforecast.attribution HEAD
          fi
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: dbt build (fixture data)
        # Real data lives only on the maintainer's machine, so CI builds every model and runs
        # every data test on a small slice of real games. Full-season count checks are off.
        run: |
          cp -R tests/fixtures/nbaf_data "$RUNNER_TEMP/nbaf_data"
          NBAF_DATA_DIR="$RUNNER_TEMP/nbaf_data" uv run nbaf dbt build --vars '{check_season_counts: false}'
