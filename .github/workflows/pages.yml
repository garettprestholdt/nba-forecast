name: Publish site

on:
  push:
    branches: [main]
  # Rebuild after every daily run, so the site shows the newest predictions and results.
  workflow_run:
    workflows: ["Daily predictions"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Build site
        run: uv run nbaf site --data-dir data-branch --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
