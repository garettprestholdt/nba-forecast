name: Daily predictions

on:
  schedule:
    # 14:00 UTC = 10am ET (9am in winter): last night's games are final, today's haven't
    # started. GitHub can start scheduled runs late; games that tip off first are skipped,
    # never predicted late.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write # push to the data branch only; main is protected

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      RECAP_MODEL: claude-sonnet-5-5
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recap date (US Eastern)
        run: echo "RECAP_DATE=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ingest results, update ratings, predict today
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run nbaf daily --data-dir data-branch
      - name: Verify (append-only, every prediction before tip-off)
        run: uv run nbaf verify --data-dir data-branch

      # Morning recap: Claude Code writes a draft from the facts file, in a folder that holds
      # nothing else (no code, no git credentials); the fact-checker decides what's published.
      - name: Prepare recap facts
        id: recap
        run: >-
          uv run nbaf recap-prepare --data-dir data-branch
          --workdir "$RUNNER_TEMP/recap" --date "$RECAP_DATE"
      - name: Set up Node (for Claude Code)
        if: steps.recap.outputs.ready == 'true' && env.HAS_CLAUDE_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recap agent (Claude Code, headless)
        if: steps.recap.outputs.ready == 'true' && env.HAS_CLAUDE_TOKEN == 'true'
        continue-on-error: true # if the agent fails, the template recap is published
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}/recap
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/scripts/run_agent.sh"
      - name: Fact-check and publish recap
        if: steps.recap.outputs.ready == 'true'
        run: >-
          uv run nbaf recap-publish --data-dir data-branch
          --workdir "$RUNNER_TEMP/recap" --date "$RECAP_DATE" --model "$RECAP_MODEL"

      - name: Commit to the data branch
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new today."
            exit 0
          fi
          git commit -m "Daily update $(TZ=America/New_York date +%F)"
          git push origin HEAD:data
