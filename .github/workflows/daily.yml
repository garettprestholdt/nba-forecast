name: Daily predictions

on:
  schedule:
    # 14:17 UTC = 10:17am ET (9:17 in winter): last night's games are final, today's haven't
    # started. GitHub can start scheduled runs hours late (2026-10-28's began at 19:10 UTC), so
    # two backups follow. The job is idempotent: a backup after a good run finds nothing new
    # and finishes in about 30 seconds; after a missed or failed run it catches up. Games that
    # have already tipped off are skipped, never predicted late. Off the hour, because GitHub
    # delays top-of-the-hour schedules most.
    - cron: "17 14 * * *"
    - cron: "17 16 * * *" # backup
    - cron: "17 18 * * *" # backup
  workflow_dispatch:

permissions:
  contents: write # push to the data branch only; main is protected

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      RECAP_MODEL: claude-sonnet-5-5
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recap date (US Eastern)
        run: echo "RECAP_DATE=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ingest results, update ratings, predict today
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run nbaf daily --data-dir data-branch
      # The hybrid (team + player) model in shadow mode: it reads last night's box scores and
      # logs its own predictions next to Elo's, but isn't the published forecast. If it fails,
      # its state isn't saved and the next run catches up; Elo's run is never blocked.
      - name: Hybrid shadow run (box scores, then today's predictions)
        continue-on-error: true
        run: uv run nbaf shadow --data-dir data-branch
      # For the site: projected standings and playoff odds (10,000 simulated seasons from
      # today's ratings), and current rosters (names, positions, injury status) for the player
      # cards. If either fails, the site keeps yesterday's version.
      - name: Box scores, shot zones and lineup stints (for player and game pages)
        continue-on-error: true
        run: uv run nbaf box-sync --data-dir data-branch
      - name: Player impact ratings (RAPM over this season and last)
        continue-on-error: true
        run: uv run nbaf impact --data-dir data-branch
      - name: Venues (today and the next two days)
        continue-on-error: true
        run: uv run nbaf venues --data-dir data-branch
      - name: Season projections
        continue-on-error: true
        run: uv run nbaf project --data-dir data-branch
      - name: Player directory
        continue-on-error: true
        run: uv run nbaf rosters --data-dir data-branch
      - name: Verify (append-only, every prediction before tip-off)
        run: uv run nbaf verify --data-dir data-branch

      # Morning recap: Claude Code writes a draft from the facts file, in a folder that holds
      # nothing else (no code, no git credentials); the fact-checker decides what's published.
      - name: Prepare recap facts
        id: recap
        run: >-
          uv run nbaf recap-prepare --data-dir data-branch
          --workdir "$RUNNER_TEMP/recap" --date "$RECAP_DATE"
      - name: Set up Node (for Claude Code)
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recap agent (Claude Code, headless)
        if: steps.recap.outputs.ready == 'true' && env.HAS_CLAUDE_TOKEN == 'true'
        continue-on-error: true # if the agent fails, the template recap is published
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}/recap
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/scripts/run_agent.sh"
      - name: Fact-check and publish recap
        if: steps.recap.outputs.ready == 'true'
        run: >-
          uv run nbaf recap-publish --data-dir data-branch
          --workdir "$RUNNER_TEMP/recap" --date "$RECAP_DATE" --model "$RECAP_MODEL"

      # Injury calls: score yesterday's against box scores, then the agent estimates whether
      # each Day-To-Day player plays tonight. Its folder holds only the candidates and prompt;
      # the keyword rule's answers stay outside it.
      - name: Prepare injury calls
        id: avail
        run: >-
          uv run nbaf availability-prepare --data-dir data-branch
          --workdir "$RUNNER_TEMP/availability" --date "$RECAP_DATE"
      - name: Availability agent (Claude Code, headless)
        if: steps.avail.outputs.ready == 'true' && env.HAS_CLAUDE_TOKEN == 'true'
        continue-on-error: true # without the agent, the keyword rule is still logged
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}/availability/agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_OUTPUT: availability.json
        run: bash "$GITHUB_WORKSPACE/scripts/run_agent.sh"
      - name: Validate and log injury calls
        if: steps.avail.outputs.ready == 'true'
        run: >-
          uv run nbaf availability-publish --data-dir data-branch
          --workdir "$RUNNER_TEMP/availability" --date "$RECAP_DATE"
      # Hybrid v2 in shadow: RAPM + who's missing, from the injury report and the calls just
      # logged. Its own pre-registered bar (docs/promotion-bar-hybrid-v2.md); never blocks Elo.
      - name: Hybrid v2 shadow run (RAPM + injury report)
        continue-on-error: true
        run: uv run nbaf shadow-v2 --data-dir data-branch
      - name: Verify again (injury calls included)
        run: uv run nbaf verify --data-dir data-branch

      - name: Commit to the data branch
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new today."
            exit 0
          fi
          git commit -m "Daily update $(TZ=America/New_York date +%F)"
          git push origin HEAD:data
