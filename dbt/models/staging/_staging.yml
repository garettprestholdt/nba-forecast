version: 2

models:
  - name: stg_espn_games
    description: One row per ESPN game, typed. Nothing is dropped here; problem rows are flagged.
    columns:
      - name: game_id
        data_tests: [unique, not_null]
      - name: season
        data_tests: [not_null]
      - name: season_type
        data_tests:
          - accepted_values:
              arguments:
                values: [regular_season, playin, playoffs]
      - name: tipoff_utc
        data_tests: [not_null]
      - name: is_exhibition
        description: True for All-Star games (teams that aren't one of the 30 franchises).
      - name: is_completed
        description: False for scheduled, in-progress, postponed, or cancelled games.
  - name: stg_espn_player_games
    description: One row per player per game from ESPN box scores, typed.
    columns:
      - name: player_game_id
        data_tests: [unique, not_null]
      - name: stats_source
        description: >
          Where this row's stats come from: 'box' (ESPN's box score), 'pbp' (rebuilt from
          play-by-play because ESPN's box score is blank), or null (no usable stats).
        data_tests:
          - accepted_values:
              arguments:
                values: [box, pbp]
  - name: stg_espn_pbp_player_games
    description: >
      Player lines rebuilt from ESPN play-by-play for blank box scores, plus a validation
      sample. usable = points add up to the final score and lineups were tracked consistently.
    columns:
      - name: player_game_id
        data_tests: [unique, not_null]
